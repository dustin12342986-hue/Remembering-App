<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D12">
<title>ADV Media — Show View</title>
<link rel="apple-touch-icon" href="adv-logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!--
  ===========================================================================
  CLIENT SHOW VIEW
  ===========================================================================

  A read-only window for a district administrator or client. Two things only:
  where the show is right now, and the monitor feed.

  WHAT IS DELIBERATELY NOT HERE

    Crew names            who is working is not a client's business
    Announcer read copy   a script in progress reads badly out of context
    Crew notes            "confirm the coin toss time with the Producer"
    Any control           this cannot advance, edit, or claim producer
    Sign-in               clients do not have crew accounts

  It reads Firebase over plain REST rather than loading the SDK, so the file
  stays small and loads fast on a phone in a stadium. `runOfShow` is already
  world-readable in the rules; nothing here needs write access.

  THE FEED

  Points at the same /monitor path as the crew app. Which source that carries
  is chosen at the switcher. Worth thinking about before handing this out:
  a multiview shows a client every camera that is not ready yet. A clean
  program feed is usually the better thing to give them.
  ===========================================================================
-->

<script src="adv-theme.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg, #0A0D12); color: var(--text, #EDEFF3);
    font-family: var(--font); font-size: 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }

  /* Fallbacks on every variable used before adv-theme.js has loaded. Without
     them a failed theme file leaves a white page with a white logo on it and
     no way in. */
  .gate {
    position: fixed; inset: 0; background: var(--bg, #0A0D12); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 22px;
  }
  .gate-card { width: 100%; max-width: 320px; text-align: center; color: var(--text, #EDEFF3); }
  .gate-logo { height: 62px; width: auto; margin-bottom: 18px; }
  .gate-title { font-size: 21px; font-weight: 800; }
  .gate-sub { font-size: 13px; color: var(--text-muted, #8A96A3); margin: 6px 0 18px; }
  .gate input {
    width: 100%; padding: 14px; font-size: 17px; text-align: center;
    font-family: inherit; letter-spacing: 1px;
    background: var(--panel, #12181F); color: var(--text, #EDEFF3);
    border: 1px solid var(--border, #26313D); border-radius: 12px; margin-bottom: 10px;
  }
  .gate-btn {
    width: 100%; padding: 14px 0; border: none; border-radius: 12px;
    background: var(--accent, #4A8FC0); color: var(--accent-ink, #fff);
    font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .gate-err { color: var(--red, #D65A4E); font-size: 13px; font-weight: 700; min-height: 20px; margin-top: 10px; }
  .gate-foot { font-size: 11px; color: var(--text-faint, #5C6774); margin-top: 26px; }

  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .head img { height: 34px; width: auto; }
  .head .adv-school-logo { height: 38px; margin-left: auto; }
  .light-btn {
    margin-left: auto; flex: 0 0 auto; background: var(--panel2);
    border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 999px; padding: 6px 13px; font-family: inherit;
    font-size: 11.5px; font-weight: 700; cursor: pointer;
  }
  /* With a crest present the button loses its auto margin, so the crest sits
     opposite the ADV mark and the button tucks in beside it. */
  .head .adv-school-logo ~ .light-btn { margin-left: 10px; }
  .head h1 { font-size: 19px; margin: 0; font-weight: 800; letter-spacing: -0.2px; }
  .sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 16px; }

  select {
    width: 100%; padding: 12px; font-size: 16px; font-family: inherit;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 11px; margin-bottom: 14px;
  }

  .vid {
    position: relative; width: 100%; padding-top: 56.25%;
    background: #000; border-radius: 13px; overflow: hidden;
    border: 1px solid var(--border); margin-bottom: 6px;
  }
  .vid video { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vid-note {
    font-size: 11.5px; color: var(--text-faint); margin-bottom: 18px;
    text-align: center;
  }

  /* Monitor sizing. An announcer is reading, not watching — the script has to
     be the thing on screen. Corner keeps the picture visible while they scroll
     the script; Hide gets it out of the way on a small phone. */
  .mon-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .mon-label {
    flex: 1; font-size: 10.5px; font-weight: 900; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-faint, #5C6774);
  }
  .mon-btn {
    background: var(--panel2, #1A222B); border: 1px solid var(--border, #26313D);
    color: var(--text-muted, #8A96A3); border-radius: 999px;
    padding: 6px 12px; font-family: inherit; font-size: 11.5px;
    font-weight: 700; cursor: pointer;
  }
  .mon-btn.on {
    border-color: var(--accent, #4A8FC0); color: var(--text, #EDEFF3);
    background: var(--info-bg, #1B2A38);
  }
  .mon-close {
    display: none; position: absolute; top: 6px; right: 6px; z-index: 2;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.62); color: #fff; border: none;
    font-size: 14px; font-weight: 800; cursor: pointer; line-height: 1;
  }

  body[data-mon="hidden"] .vid,
  body[data-mon="hidden"] .vid-note { display: none; }

  body[data-mon="mini"] .vid {
    position: fixed; right: 10px; bottom: 10px; z-index: 40;
    width: 42vw; max-width: 210px; padding-top: 0; aspect-ratio: 16/9;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5); margin: 0;
  }
  body[data-mon="mini"] .vid video { position: absolute; inset: 0; }
  body[data-mon="mini"] .vid-note { display: none; }
  body[data-mon="mini"] .mon-close { display: block; }

  body[data-mon="full"] .vid {
    position: fixed; inset: 0; z-index: 60; width: 100%; height: 100%;
    padding-top: 0; border-radius: 0; margin: 0;
  }
  body[data-mon="full"] .vid video { position: absolute; inset: 0; object-fit: contain; }
  body[data-mon="full"] .vid-note { display: none; }
  body[data-mon="full"] .mon-close { display: block; }

  .now {
    background: var(--panel); border: 1px solid var(--accent);
    border-left: 4px solid var(--accent);
    border-radius: 13px; padding: 15px; margin-bottom: 10px;
  }
  .tag {
    font-size: 9.5px; font-weight: 900; letter-spacing: 1px;
    text-transform: uppercase; color: var(--accent);
  }
  .now-time { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; font-weight: 700; }
  .now-event { font-size: 21px; font-weight: 800; line-height: 1.2; margin-top: 2px; }
  .now-screen { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
  .now-screen b { color: var(--text); font-weight: 700; }

  .next {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 15px; margin-bottom: 18px;
  }
  .next .tag { color: var(--text-faint); }
  .next-event { font-size: 15px; font-weight: 700; margin-top: 3px; }

  .sec { font-size: 10px; font-weight: 900; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-faint); margin: 18px 0 7px; }
  .row {
    display: flex; gap: 11px; padding: 9px 2px;
    border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .row.done { opacity: 0.4; }
  .row.live { background: var(--info-bg); border-radius: 8px; padding: 9px 10px; }
  .row-time {
    flex: 0 0 62px; font-size: 12px; color: var(--text-muted);
    font-weight: 700; font-variant-numeric: tabular-nums; padding-top: 2px;
  }
  .row-event { flex: 1; min-width: 0; }
  .row-screen { display: block; font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }

  .read {
    margin-top: 12px; padding: 12px 14px; border-radius: 10px;
    background: var(--panel2, #1A222B); border-left: 3px solid var(--accent, #4A8FC0);
    font-size: 17px; line-height: 1.5; white-space: pre-wrap;
  }
  .note {
    margin-top: 8px; font-size: 12.5px; color: var(--amber, #E0A63C); font-weight: 700;
  }
  .row-read {
    display: block; font-size: 13px; color: var(--text-muted, #8A96A3);
    margin-top: 5px; white-space: pre-wrap; line-height: 1.45;
  }

  .empty { color: var(--text-muted); font-size: 14px; padding: 20px 0; text-align: center; }
  .foot { margin-top: 26px; font-size: 11px; color: var(--text-faint); text-align: center; }
</style>
</head>

// ---- Branding --------------------------------------------------------------
// The school is decided by the fixture, not by whoever is holding the phone.
// A district administrator opening a Crowley game sees Crowley purple and the
// Crowley crest. There is nothing to choose and nothing to get wrong.
//
// The only thing a viewer controls is light or dark, because that is about the
// room they are standing in — bright stands or a dark press box — not about
// branding.
//
// NCHS is tested before CHS: "NCHS vs Aledo" contains "CHS".
function schoolFor(game) {
  const o = (game && game.opp) || "";
  if (/^NCHS/i.test(o)) return { id: "nchs",  name: "North Crowley",  logo: "school-nchs.png" };
  if (/^CHS/i.test(o))  return { id: "chs",   name: "Crowley",        logo: "school-chs.png" };
  if (/wesleyan/i.test(o)) return { id: "txwes", name: "Texas Wesleyan", logo: "school-txwes.png" };
  return null;
}

const LIGHT_KEY = "advShowViewLight";

function applyBranding(game) {
  const school = schoolFor(game);
  const light = localStorage.getItem(LIGHT_KEY) === "1";
  const root = document.documentElement;

  if (school) {
    root.setAttribute("data-theme", school.id + (light ? "-light" : ""));
  } else {
    root.setAttribute("data-theme", light ? "light" : "");
  }

  const host = document.querySelector(".head");
  let crest = host.querySelector(".adv-school-logo");
  if (school) {
    if (!crest) {
      crest = document.createElement("img");
      crest.className = "adv-school-logo";
      crest.alt = "";
      const btn = host.querySelector("#lightBtn");
      host.insertBefore(crest, btn || null);
    }
    if (crest.getAttribute("src") !== school.logo) crest.setAttribute("src", school.logo);
  } else if (crest) {
    crest.remove();
  }

  const btn = document.getElementById("lightBtn");
  if (btn) btn.textContent = light ? "Dark" : "Light";

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", getComputedStyle(root).getPropertyValue("--bg").trim());
}

// ---- Access code -----------------------------------------------------------
// WHAT THIS IS AND IS NOT
//
// This keeps out someone who is forwarded the link or stumbles on it. It is
// NOT security. This page is public on GitHub Pages, so anyone who opens the
// source can find their way past it. Do not treat the code as protecting
// anything sensitive — and nothing sensitive is on this page, which is why a
// gate at this level is the right amount.
//
// The code is stored as a SHA-256 hash rather than plain text, so it is not
// sitting in the source in readable form.
//
// TO CHANGE THE CODE
//   1. Pick a word.
//   2. In any browser console: 
//      crypto.subtle.digest("SHA-256", new TextEncoder().encode("yourword"))
//        .then(b => console.log([...new Uint8Array(b)]
//        .map(x => x.toString(16).padStart(2,"0")).join("")))
//   3. Paste the result over ACCESS_HASH below and re-upload.
//
// Codes are compared lower case, so it does not matter how anyone types it.
// TWO CODES, TWO LEVELS
//
//   ADV2026     — DJ, band director, management. Cue position and the feed.
//   SCRIPT2026  — announcers. Same page plus the word-for-word read copy.
//
// One page rather than two files, because two files means two things to keep
// in step and eventually one of them is a game behind.
const ACCESS_HASH = "0691b7be813b56c9b6159c8c591948f7ea814100fb94c4839a71a2890753a233";
const SCRIPT_HASH = "b5159dd2b4814837f489d4119db67e80f8ab94eafbdcc0aec4491817278f3501";
const ACCESS_KEY = "advShowViewOk";

// "1" = view only, "2" = view plus script.
let accessLevel = 1;

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, "0")).join("");
}

function unlock() {
  const sub = document.getElementById("subLine");
  if (sub && accessLevel === 2) sub.textContent = "Full script — where the show is right now.";
  document.getElementById("gate").style.display = "none";
  document.getElementById("wrap").style.display = "";
  start();
}

async function tryCode() {
  const input = document.getElementById("gateInput");
  const err = document.getElementById("gateErr");
  const val = (input.value || "").trim().toLowerCase();
  if (!val) return;
  let hash;
  try {
    hash = await sha256(val);
  } catch (e) {
    // crypto.subtle needs a secure context. On GitHub Pages it is https, so
    // this only bites when testing over plain http.
    err.textContent = "This page needs to be opened over https.";
    return;
  }
  if (hash === ACCESS_HASH || hash === SCRIPT_HASH) {
    accessLevel = hash === SCRIPT_HASH ? 2 : 1;
    try { localStorage.setItem(ACCESS_KEY, String(accessLevel)); } catch (e) {}
    unlock();
  } else {
    err.textContent = "That code isn't right.";
    input.value = "";
    input.focus();
  }
}

const DB = "https://crowley-football-default-rtdb.firebaseio.com";
const MONITOR = "https://assembly-brian-workout-momentum.trycloudflare.com/monitor/index.m3u8";

// Client view shows the technical grid, never the announcer copy. `read` and
// `notes` are read from Firebase like everything else and simply not rendered.
const SHOW_FIELDS = ["time", "event", "screen", "ribbon"];

function localDateId() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
       + "-" + String(d.getDate()).padStart(2, "0");
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

let gameId = null;
let cues = [];
let current = 0;

const sel = document.getElementById("gameSel");
GAMES.forEach((g) => {
  const o = document.createElement("option");
  o.value = g.id;
  o.textContent = `${g.day} ${g.date} — ${g.opp}`;
  sel.appendChild(o);
});

const today = localDateId();
const todayGame = GAMES.find((g) => g.id === today);
gameId = todayGame ? todayGame.id : (GAMES.find((g) => g.id >= today) || GAMES[0]).id;
sel.value = gameId;
sel.onchange = () => {
  gameId = sel.value;
  cues = [];
  applyBranding(GAMES.find((g) => g.id === gameId));
  poll();
};

document.getElementById("lightBtn").onclick = () => {
  const now = localStorage.getItem(LIGHT_KEY) === "1";
  try { localStorage.setItem(LIGHT_KEY, now ? "0" : "1"); } catch (e) {}
  applyBranding(GAMES.find((g) => g.id === gameId));
};

async function poll() {
  try {
    const res = await fetch(`${DB}/runOfShow/${gameId}.json`, { cache: "no-store" });
    const data = await res.json();
    cues = (data && data.cues) || [];
    current = (data && typeof data.current === "number") ? data.current : 0;
  } catch (e) {
    cues = [];
  }
  draw();
}

function draw() {
  const root = document.getElementById("body");
  if (!cues.length) {
    root.innerHTML = `<div class="empty">The run of show for this game hasn't been published yet.</div>`;
    return;
  }

  const cur = cues[current] || cues[0];
  const nxt = cues[current + 1];

  let html = `
    <div class="now">
      <span class="tag">On now</span>
      ${cur.time ? `<div class="now-time">${esc(cur.time)}${cur.dur ? " · " + esc(cur.dur) : ""}</div>` : ""}
      <div class="now-event">${esc(cur.event || "")}</div>
      ${cur.screen ? `<div class="now-screen">Screen: <b>${esc(cur.screen)}</b></div>` : ""}
      ${cur.ribbon ? `<div class="now-screen">Ribbon: <b>${esc(cur.ribbon)}</b></div>` : ""}
      ${accessLevel === 2 && cur.read ? `<div class="read">${esc(cur.read)}</div>` : ""}
      ${accessLevel === 2 && cur.notes ? `<div class="note">${esc(cur.notes)}</div>` : ""}
    </div>`;

  if (nxt) {
    html += `
      <div class="next">
        <span class="tag">Coming up</span>
        <div class="next-event">${esc(nxt.event || "")}${nxt.time ? ` <span style="color:var(--text-faint);font-weight:600;">${esc(nxt.time)}</span>` : ""}</div>
      </div>`;
  }

  let section = null;
  cues.forEach((c, i) => {
    if (c.section && c.section !== section) {
      section = c.section;
      html += `<div class="sec">${esc(section)}</div>`;
    }
    const cls = i < current ? "done" : i === current ? "live" : "";
    html += `
      <div class="row ${cls}">
        <span class="row-time">${esc(c.time || "")}</span>
        <span class="row-event">${esc(c.event || "")}
          ${c.screen ? `<span class="row-screen">${esc(c.screen)}</span>` : ""}
          ${accessLevel === 2 && c.read ? `<span class="row-read">${esc(c.read)}</span>` : ""}
        </span>
      </div>`;
  });

  root.innerHTML = html;
}

// ---- Monitor ---------------------------------------------------------------
const video = document.getElementById("mon");
const note = document.getElementById("monNote");

function startVideo() {
  const kick = () => {
    const p = video.play();
    if (p && p.catch) p.catch(() => { note.textContent = "Tap the picture to start."; });
  };
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = MONITOR;
    video.addEventListener("loadedmetadata", kick, { once: true });
    kick();
    note.textContent = "Live from the control room.";
  } else if (window.Hls && window.Hls.isSupported()) {
    const hls = new window.Hls({ liveSyncDurationCount: 2 });
    hls.loadSource(MONITOR);
    hls.attachMedia(video);
    hls.on(window.Hls.Events.MANIFEST_PARSED, kick);
    hls.on(window.Hls.Events.ERROR, (_, d) => {
      if (d.fatal) note.textContent = "The monitor feed isn't running right now.";
    });
    note.textContent = "Live from the control room.";
  } else {
    note.textContent = "This browser can't play the monitor feed.";
  }
}

// Nothing loads until the code is accepted — no polling, no video, no data
// fetched behind the gate.
let started = false;
function start() {
  if (started) return;
  started = true;
  applyBranding(GAMES.find((g) => g.id === gameId));
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    startVideo();
  } else {
    const s2 = document.createElement("script");
    s2.src = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
    s2.onload = startVideo;
    s2.onerror = () => { note.textContent = "Couldn't load the video player."; };
    document.head.appendChild(s2);
  }
  poll();
  setInterval(poll, 4000);
}

// Monitor size, remembered per device so it is set once.
const MON_KEY = "advShowViewMon";
function setMonSize(size) {
  document.body.setAttribute("data-mon", size);
  try { localStorage.setItem(MON_KEY, size); } catch (e) {}
  document.querySelectorAll("[data-size]").forEach((el) => {
    el.classList.toggle("on", el.dataset.size === size);
  });
}
document.querySelectorAll("[data-size]").forEach((el) => {
  el.onclick = () => setMonSize(el.dataset.size);
});
document.getElementById("monClose").onclick = () => setMonSize("normal");
setMonSize((() => { try { return localStorage.getItem(MON_KEY) || "normal"; } catch (e) { return "normal"; } })());

document.getElementById("gateGo").onclick = tryCode;
document.getElementById("gateInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryCode();
});

// Remembered so the DJ and the band director enter it once, not every game.
try {
  const saved = localStorage.getItem(ACCESS_KEY);
  if (saved === "1" || saved === "2") { accessLevel = Number(saved); unlock(); }
} catch (e) {}
